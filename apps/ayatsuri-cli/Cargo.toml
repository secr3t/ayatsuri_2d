[package]
name = "ayatsuri-cli"
description = "Headless Ayatsuri2D: auto-rig a layered drawing into a moc3 bundle"
version.workspace = true
authors.workspace = true
repository.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "ayatsuri-cli"
path = "src/main.rs"

[dependencies]
ayatsuri-core = { workspace = true }
ayatsuri-format = { workspace = true }
ayatsuri-import = { workspace = true }
serde_json = { workspace = true }
# reads the atlas pages' alpha for the auto mesher
image = { version = "0.25", default-features = false, features = ["png"] }
